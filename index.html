<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>សិរីសួស្តីពិធីភ្ជាប់ពាក្យ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&family=Hanuman:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Moul';
            src: url('./Muol-Light.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Moul', 'Hanuman', serif;
        }
        
        /* Page wrapper with fixed width for desktop */
        .page-wrapper {
            max-width: 768px;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            position: relative;
            /* background-color: #f8f8f8; */
        }
        
        .welcome-container {
            width: 100%;
            height: 100vh;
            background: url('./opening.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .button-container {
            position: relative;
            padding: 10px;
            background-size: 100% 100%;
            margin-bottom: 30px;
            border-radius: 50px;
        }
        .content {
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 45px;
        }
        
        .logo {
            width: 300px;
            margin-bottom: 20px;
        }
        
        .title {
            color: #524c47;
            font-size: 2.5rem;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .subtitle {
            color: #524c47;
            font-size: 1.8rem;
        }
        
        .open-button {
            background: linear-gradient(to bottom, #524c47, #3e3934);
            color: white;
            border: none;
            padding: 15px 35px;
            font-family: 'Moul', 'Hanuman', serif;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .open-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .open-button:hover::before {
            left: 100%;
        }
        
        .open-button:hover {
            transform: translateY(-3px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.4);
        }
        
        /* Responsive adjustments */
        @media screen and (max-width: 768px) {
            .title {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1.4rem;
            }
            
            .logo {
                width: 220px;
            }
        }
        
        @media screen and (max-width: 480px) {
            .title {
                font-size: 1.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .logo {
                width: 180px;
            }
            
            .open-button {
                font-size: 1rem;
                padding: 12px 25px;
            }
        }
        
        /* Desktop styling for tablet-like experience */
        @media screen and (min-width: 1025px) {
            body {
                background-color: #f0f0f0;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .page-wrapper {
                border-radius: 10px;
                box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
                overflow: hidden;
                height: 95vh;
            }
        }
        .guest-name-box {
            width: 85%;
            /* margin: 15px auto; */
            /* padding: 10px 15px; */
            background-color: white;
            border: 3.5px solid #9c8f7f;
            text-align: center;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            margin:15px
        }
        .guest-name-text {
          font-family: 'Moul', 'Hanuman', cursive, serif;
          color: black;
          font-size: 0.70rem;
          /* Fix the line height for proper vertical alignment */
          line-height: 1.5;
          margin: 0;
          padding: 0;
          /* These ensure the text is centered within the span */
          display: inline-block;
          width: 100%;
        }
        /* Media query for smaller screens */
        @media screen and (max-width: 375px) {
          .guest-name-box {
            width: 85%;
            min-height: 35px;
          }
          
          .guest-name-text {
            font-size: 0.45rem;
          }
        }

        /* Define a class for English text */
        .english-text {
            font-family: 'Pinyon Script', 'Tangerine', 'Great Vibes';
            font-size: 1.1rem; /* Adjust this value as needed */
        }

        /* Add language detection for automatic styling */
        /* This will apply to any element with the lang="en" attribute */
        [lang="en"],
        [lang="en-US"],
        [lang="en-GB"] {
            font-family: 'Pinyon Script', 'Tangerine', 'Great Vibes' !important;
            font-size: 110%; /* Make English text slightly larger */
            font-weight: normal;
        }

        /* Add the font imports */
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pinyon+Script&family=Tangerine:wght@400;700&display=swap');

        /* Special override for guest name box if it contains English */
        .guest-name-box[data-lang="en"] .guest-name-text {
            font-family: 'Pinyon Script', 'Tangerine', 'Great Vibes', cursive;
            font-size: 1.2rem; /* Larger size for English in the guest box */
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="welcome-container">
            <div class="content">
                <img src="./logo.png" alt="Logo" class="logo">
                <h1 class="title">សិរីសួស្តីពិធីភ្ជាប់ពាក្យ</h1>
                <p class="subtitle">សូមគោរពអញ្ជើញ</p>
                <div class="guest-name-box">
                    <span id="guest-name-placeholder" class="guest-name-text">ឯកឧត្តម និង លោកជំទាវ</span>
                </div>
                <div class="button-container">
                    <button class="open-button" id="openInvitation">សូម​ចុច​បើកសំបុត្រ</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Function to get URL parameters
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        
        // Update guest name in the invitation if present in URL
        function updateGuestName() {
            const guestNameParam = getQueryParam('name');
            const guestNameElement = document.getElementById('guest-name-placeholder');
            const guestNameBox = document.querySelector('.guest-name-box');
            
            if (guestNameParam && guestNameElement) {
                // Decode the URL-encoded name parameter
                const decodedName = decodeURIComponent(guestNameParam);
                guestNameElement.textContent = decodedName;
                
                // Check if the text is primarily English
                // Simple check: if it has more Latin characters than others
                const englishPattern = /[a-zA-Z]/g;
                const nonEnglishPattern = /[^\u0000-\u007F]/g;
                
                const englishChars = (decodedName.match(englishPattern) || []).length;
                const nonEnglishChars = (decodedName.match(nonEnglishPattern) || []).length;
                
                // If it has more English characters than non-English
                if (englishChars > nonEnglishChars) {
                    guestNameBox.setAttribute('data-lang', 'en');
                }
            }
        }
        
        // Call the function when the page loads
        window.addEventListener('DOMContentLoaded', updateGuestName);

        // Handle button click to navigate to main page
        document.getElementById('openInvitation').addEventListener('click', function() {
            // Get the current URL parameters
            const currentUrl = window.location.href;
            const urlParams = new URLSearchParams(window.location.search);
            
            // Check if there are any parameters
            if (urlParams.toString()) {
                // Redirect to index-main.html with the same parameters
                window.location.href = 'index-main.html' + window.location.search;
            } else {
                // No parameters, just go to index-main.html
                window.location.href = 'index-main.html';
            }
        });

        
    </script>
</body>
</html>
