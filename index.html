<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>សិរីសួស្តីពិធីភ្ជាប់ពាក្យ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&family=Hanuman:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Moul';
            src: url('./Muol-Light.ttf') format('truetype');
            font-weight: 100;
            font-style: normal;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Moul', 'Hanuman', serif;
        }
        
        .welcome-container {
            width: 100%;
            height: 100vh;
            background: url('./opening.jpg') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            z-index: 1;
        }
        
        .content {
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 45px;
        }
        
        .logo {
            width: 300px;
            margin-bottom: 20px;
        }
        
        .title {
            color: #524c47;
            font-size: 2.5rem;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .subtitle {
            color: #524c47;
            font-size: 1.8rem;
            margin-bottom: 60px;
        }
        
        .open-button {
            background: linear-gradient(to bottom, #524c47, #3e3934);
            color: white;
            border: none;
            padding: 15px 35px;
            font-family: 'Moul', 'Hanuman', serif;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 50px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .open-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .open-button:hover::before {
            left: 100%;
        }
        
        .open-button:hover {
            transform: translateY(-3px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.4);
        }

            margin-bottom: 30px;
            border-radius: 50px;
        }
        
        @media screen and (max-width: 768px) {
            .title {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1.4rem;
            }
            
            .logo {
                width: 220px;
            }
        }
        
        @media screen and (max-width: 480px) {
            .title {
                font-size: 1.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .logo {
                width: 180px;
            }
            
            .open-button {
                font-size: 1rem;
                padding: 12px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <!-- <div class="overlay"></div> -->
        <div class="content">
            <img src="./logo.png" alt="Logo" class="logo">
            <h1 class="title">សិរីសួស្តីពិធីភ្ជាប់ពាក្យ</h1>
            <p class="subtitle">សូមគោរពអញ្ជើញ</p>
            <div class="button-container">
                <button class="open-button" id="openInvitation">សូម​ចុច​បើកសំបុត្រ</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('openInvitation').addEventListener('click', function() {
            // Get the current URL parameters
            const currentUrl = window.location.href;
            const urlParams = new URLSearchParams(window.location.search);
            
            // Check if there are any parameters
            if (urlParams.toString()) {
                // Redirect to index-main.html with the same parameters
                window.location.href = 'index-main.html' + window.location.search;
            } else {
                // No parameters, just go to index-main.html
                window.location.href = 'index-main.html';
            }
        });
    </script>
</body>
